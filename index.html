function openCodeUI(){document.getElementById('code-overlay').style.display='flex';document.getElementById('code-input').value='';document.getElementById('code-input').focus()}
function closeCodeUI(){document.getElementById('code-overlay').style.display='none'}
function submitCode(){
    const input=document.getElementById('code-input').value.trim().toUpperCase(); // Фикс регистра
    closeCodeUI();
    if(input==='MTB-DEV-99'||input==='MTB-TEST-01'){
        let conf=prompt("Код подтверждения:");
        let c2=conf?conf.replace(/\s/g,'').toUpperCase():'';
        if(c2==='DF2017'||c2==='DF2016'||c2==='DF99'){
            if(devCodeUsed){pendingDevCode=input;document.getElementById('warn-overlay').style.display='flex'}
            else{activateDevCode(input)}
        }else alert("НЕВЕРНЫЙ КОД!")
    }else if(input==='ЮМИ'||input==='КОТ'){$+=35000;save();alert('СЕКРЕТНЫЙ КОД!\n+$35000!')}
    else if(input.startsWith('CODE-')){
        const num=parseInt(input.split('-')[1]);
        if(num>=1&&num<=150){if(usedCodes.includes(num))return alert('Промокод использован!');usedCodes.push(num);$+=5000;M+=10;save();alert('Промокод активирован!')}
        else alert('Неверный код.')
    }else alert('Неверный код.')
}

// Управление
function transformTouch(cx,cy){const s=settings.scale||1;let gx,gy;if(!isRotated){gx=cx;gy=cy}else{gx=cy;gy=H-cx}return[(gx-W/2)/s+W/2,(gy-H/2)/s+H/2]}
function handleTap(cx,cy,id){
    const coords=transformTouch(cx,cy),px=coords[0],py=coords[1];ptr[id]=[px,py];
    const pad=isTablet?30:20; // Увеличенный хитбокс для планшетов и телефонов
    for(let i=btns.length-1;i>=0;i--){const b=btns[i];
        if(b.cx!==undefined){if(Math.hypot(px-b.cx,py-b.cy)<=b.r+pad){if(b.onTap){beep(700,0.05);b.onTap();return}if(b.f&&!b.hold){beep(700,0.05);b.f();return}}}
        else if(px>=b.x-pad&&px<=b.x+b.w+pad&&py>=b.y-pad&&py<=b.y+b.h+pad){if(b.onTap){beep(700,0.05);b.onTap();return}if(b.f){beep(700,0.05);b.f();return}}
    }
}
function handleUp(id){delete ptr[id]}
let usingPointer=false;
c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;usingPointer=true;e.preventDefault();initAudio();handleTap(e.clientX,e.clientY,e.pointerId)},{passive:false});
c.addEventListener('pointerup',e=>{e.preventDefault();handleUp(e.pointerId)},{passive:false});
c.addEventListener('pointercancel',e=>{e.preventDefault();handleUp(e.pointerId)},{passive:false});
c.addEventListener('touchstart',e=>{if(usingPointer)return;e.preventDefault();initAudio();for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];handleTap(t.clientX,t.clientY,t.identifier)}},{passive:false});
c.addEventListener('touchend',e=>{if(usingPointer)return;e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){handleUp(e.changedTouches[i].identifier)}},{passive:false});
c.addEventListener('touchcancel',e=>{if(usingPointer)return;e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){handleUp(e.changedTouches[i].identifier)}},{passive:false});
c.addEventListener('mousedown',e=>{if(usingPointer)return;initAudio();handleTap(e.clientX,e.clientY,'m')});
c.addEventListener('mouseup',()=>{if(!usingPointer)handleUp('m')});

function limb(hx,hy,fx,fy,l,dir,w,col){let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy)||1;const ux=dx/d,uy=dy/d;d=Math.min(d,2*l-.01);const a=d/2,h=Math.sqrt(Math.max(0,l*l-a*a)),kx=hx+ux*a-uy*h*dir,ky=hy+uy*a+ux*h*dir,ex=hx+ux*d,ey=hy+uy*d;g.lineWidth=w;g.strokeStyle=col;g.lineCap='round';g.beginPath();g.moveTo(hx,hy);g.lineTo(kx,ky);g.lineTo(ex,ey);g.stroke();return[ex,ey,kx,ky]}

function drawRider(ca,trk,customGear){
    trk=trk||{};const px=Math.cos(ca)*6,py=Math.sin(ca)*6;
    let cg=customGear||gear;let jc=cg.jersey||cg.j||'#e33',pc=cg.pants||cg.p||'#222';let hc=cg.helmet||cg.h||'#fc0';let isFox=cg.fox,isRb=cg.rb;
    const prog=(trk.t>0&&trk.maxT>0)?(1-trk.t/trk.maxT):0;const ext=Math.sin(prog*Math.PI);
    let hip=[-8,-18],sh=[2,-36],hand=[11,-22];
    if(trk.name==='SUPERMAN'){hip=[-8,-18-ext*20];sh=[2-ext*35,-36-ext*10];hand=[11-ext*8,-22-ext*5]}
    if(trk.name==='NO-HANDER'){hand=[11+ext*8,-22-ext*40]}
    let f2=limb(hip[0],hip[1],-px,8-py,16.5,-1,7,'#1a1a1a');
    g.lineWidth=11;g.strokeStyle=jc;g.lineCap='round';g.beginPath();g.moveTo(hip[0],hip[1]);g.lineTo(sh[0],sh[1]);g.stroke();
    g.lineWidth=3;g.strokeStyle='#fff';g.beginPath();g.moveTo(hip[0]+2,hip[1]-4);g.lineTo(sh[0]-1,sh[1]+4);g.stroke();
    g.fillStyle='#fff';g.font='bold 7px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('7',(hip[0]+sh[0])/2+1,(hip[1]+sh[1])/2);

function drawBike(k,wr,rid,cfg,trk,isBraking,customGear){
    cfg=cfg||bikeConfig();trk=trk||{};const prog=(trk.t>0&&trk.maxT>0)?(1-trk.t/trk.maxT):0;
    const wyf=10-k,wyr=10-k*.7;g.lineCap='round';g.lineJoin='round';const ca=wr/14,px=Math.cos(ca)*6,py=Math.sin(ca)*6;const tW=cfg.tireW||8;
    const brakeSquish=isBraking?3:0,forkY=isBraking?2:0;
    g.save();
    if(trk.name==='TABLETOP'){const tilt=Math.sin(prog*Math.PI)*Math.PI*.35;g.rotate(tilt)}
    if(trk.name==='360 SPIN'){const sx=Math.abs(Math.cos(prog*Math.PI*2));g.scale(Math.max(0.15,sx),1)}
    [[-24,wyr,0],[24,wyf,1]].forEach(w=>{
        const X=w[0],Y=w[1];
        g.lineWidth=tW*.55;g.strokeStyle=isBraking?'#333':cfg.tireCol;g.beginPath();g.arc(X,Y,tW*1.15,0,7);g.stroke();
        g.lineWidth=1;g.strokeStyle='#000';for(let i=0;i<12;i++){const a=wr/10+i*.52;g.beginPath();g.moveTo(X+Math.cos(a)*(tW*1.15-1),Y+Math.sin(a)*(tW*1.15-1));g.lineTo(X+Math.cos(a)*(tW*1.15+1),Y+Math.sin(a)*(tW*1.15+1));g.stroke()}
        g.lineWidth=2.5;g.strokeStyle=cfg.rimCol;g.beginPath();g.arc(X,Y,7.6,0,7);g.stroke();
        g.lineWidth=1;g.strokeStyle='rgba(255,255,255,0.6)';g.beginPath();g.arc(X,Y,7.6,0,7);g.stroke();
        g.lineWidth=.8;g.strokeStyle='#aaa';for(let i=0;i<8;i++){const a=wr/11+i*.785;g.beginPath();g.moveTo(X,Y);g.lineTo(X+Math.cos(a)*7.6,Y+Math.sin(a)*7.6);g.stroke()}
        g.fillStyle='#777';g.beginPath();g.arc(X,Y,2,0,7);g.fill();
        if(isBraking){g.fillStyle='#e33';g.fillRect(X-2,Y+8,6,4)}
    });
    const fp=()=>{g.beginPath();g.moveTo(-6,-12);g.lineTo(14,-15);g.moveTo(14,-14);g.lineTo(0,8);g.moveTo(-8,-16);g.lineTo(0,8);g.moveTo(0,8);g.lineTo(-24,wyr);g.moveTo(-6,-6);g.lineTo(-24,wyr);g.stroke()};
    g.lineWidth=5;g.strokeStyle=cfg.frameCol;fp();g.lineWidth=2;g.strokeStyle='rgba(255,255,255,0.5)';fp();
    const shockY=8.5+(isBraking?1:0);g.lineWidth=4;g.strokeStyle='#ff6600';g.beginPath();g.moveTo(-5,-7);g.lineTo(-12,shockY);g.stroke();g.lineWidth=2;g.strokeStyle='#ddd';g.beginPath();g.moveTo(-5,-7);g.lineTo(-12,shockY);g.stroke();
    const fTopX=14,fTopY=-17,fBotX=24,fBotY=wyf-brakeSquish;g.lineWidth=5;g.strokeStyle=cfg.forkCol;g.beginPath();g.moveTo(fTopX,fTopY);g.lineTo(fTopX+5,0+forkY);g.stroke();g.lineWidth=4;g.strokeStyle='#222';g.beginPath();g.moveTo(fTopX+5,0+forkY);g.lineTo(fBotX,fBotY);g.stroke();
    g.lineWidth=1.5;g.strokeStyle='rgba(255,255,255,0.5)';g.beginPath();g.moveTo(fTopX,fTopY);g.lineTo(fTopX+5,0+forkY);g.stroke();
    g.lineWidth=4;g.strokeStyle='#222';g.beginPath();g.moveTo(fTopX,fTopY);g.lineTo(fTopX-2,fTopY-5);g.stroke();g.lineWidth=3;g.strokeStyle='#111';g.beginPath();g.moveTo(fTopX-8,fTopY-6);g.lineTo(fTopX+4,fTopY-4);g.stroke();
    g.fillStyle='#111';g.save();g.translate(-14,-21);g.scale(1,0.4);g.beginPath();g.arc(0,0,10,0,Math.PI*2);g.fill();g.restore();
    g.lineWidth=2;g.strokeStyle='#666';g.beginPath();g.moveTo(-px,8-py);g.lineTo(px,8+py);g.stroke();
    if(isBraking&&P.vx>2){g.fillStyle='rgba(200,200,200,0.6)';for(let i=0;i<3;i++){const px=-30-Math.random()*10;const py=wyr+5+Math.random()*5;g.beginPath();g.arc(px,py,2+Math.random()*3,0,7);g.fill()}}
    if(rid!==false)drawRider(ca,trk,customGear);g.restore();

function drawBeautifulSky(camera){
    const w=W,h=H;
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,TR[tr].sky); // Используем цвет карты
    grd.addColorStop(1,'#a8d8ff');
    g.fillStyle=grd;g.fillRect(0,0,w,h);
    const sunX=w*.85,sunY=h*.18;g.fillStyle='rgba(255,255,180,.4)';g.beginPath();g.arc(sunX,sunY,w*.08,0,7);g.fill();g.fillStyle='#ffe066';g.beginPath();g.arc(sunX,sunY,w*.06,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<6;i++){const cx=((i*(w*.3)-camera*.2)%(w+200))-100;const cy=h*.1+(i%3)*h*.08;const sz=w*.04;g.beginPath();g.arc(cx,cy,sz,0,7);g.arc(cx+sz,cy,sz*.83,0,7);g.arc(cx-sz,cy,sz*.83,0,7);g.fill()}
    g.fillStyle='#6b8e5a';g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=20){const wx=camera*.3+x;g.lineTo(x,h-200+Math.sin(wx*.005)*80+Math.sin(wx*.013)*40)}g.lineTo(w,h);g.fill()
}
function drawBeautifulTerrain(camera){

// Режим ДЁРТ (Фикс зависания и лопата)
function dirtModeFunc(dt){
    const fs=Math.min(3,dt*60),w=W,h=H,groundY=h*0.75;
    if(dirtMode.state==='walk'){
        if(heldCircle(w*0.2,h*0.8,50))dirtMode.px-=100*dt;
        if(heldCircle(w*0.8,h*0.8,50))dirtMode.px+=100*dt;
    }else if(dirtMode.state==='ride'){
        if(!dirtMode.air){
            const gas=heldCircle(w*0.8,h*0.8,50),brake=heldCircle(w*0.2,h*0.8,50);
            if(gas)dirtMode.vx+=150*dt;else if(brake)dirtMode.vx-=200*dt;else dirtMode.vx*=0.98;
            dirtMode.vx=Math.max(0,Math.min(300,dirtMode.vx));
            dirtMode.px+=dirtMode.vx*dt;
            dirtMode.ramps.forEach(r=>{
                if(Math.abs(dirtMode.px-r.x)<20&&dirtMode.vx>100){
                    dirtMode.air=true;dirtMode.vy=-15;dirtMode.rot=0;dirtMode.vx=dirtMode.vx*1.2;
                    trick={name:'',t:0,maxT:0,bonus:0,col:'#fff',angle:0};
                }
            });
        }else{
            dirtMode.vy+=30*dt;dirtMode.px+=dirtMode.vx*dt;
            if(heldCircle(w*0.2,h*0.8,50))dirtMode.rot-=5*dt;
            if(heldCircle(w*0.8,h*0.8,50))dirtMode.rot+=5*dt;
            // ФИКС ЗАВИСАНИЯ: проверяем, есть ли вообще трамплины в массиве
            if(dirtMode.ramps.length > 0 && dirtMode.vy>0&&dirtMode.px>dirtMode.ramps[0].x+150){
                dirtMode.air=false;dirtMode.vy=0;
                let la=dirtMode.rot%(Math.PI*2),safe=false;
                if(la>-0.5&&la<0.5)safe=true;
                if(Math.abs(la)>5.5&&Math.abs(la)<6.8)safe=true;
                if(safe){let b=50;if(Math.abs(la)>5.5)b=100;if(trick.name)b+=50;$+=b;say('УДАЧНО! +'+b+'$');save();}
                else{say('УПАЛ!');dirtMode.state='walk';dirtMode.vx=0;}
                dirtMode.rot=0;
            }
        }
    }
    drawBeautifulSky(dirtMode.px-W/2);g.fillStyle='#5a3d1f';g.fillRect(0,groundY,w,h-groundY);g.fillStyle='#3fa34d';g.fillRect(0,groundY-10,w,10);
    dirtMode.ramps.forEach(r=>{let sx=r.x-(dirtMode.px-W/2);if(sx>-100&&sx<w+100){g.fillStyle='#8b5a2b';g.beginPath();g.moveTo(sx-50,groundY);g.lineTo(sx,groundY-60);g.lineTo(sx+50,groundY);g.fill();g.fillStyle='#5a3d1f';g.fillRect(sx-40,groundY-10,80,10);}});
    
    let pSX=dirtMode.px-(dirtMode.px-W/2);if(pSX<50)pSX=50;
    g.save();g.translate(pSX,groundY);
    
    if(dirtMode.state==='walk'||dirtMode.state==='dig'){
        let cg=RD[R]&&RD[R].g?RD[R].g:RD[0].g;
        g.lineWidth=10;g.strokeStyle=cg.j;g.beginPath();g.moveTo(0,0);g.lineTo(0,-30);g.stroke();
        g.lineWidth=6;g.strokeStyle=cg.p;g.beginPath();g.moveTo(0,0);g.lineTo(-10,20);g.stroke();g.beginPath();g.moveTo(0,0);g.lineTo(10,20);g.stroke();
        g.fillStyle=cg.h;g.beginPath();g.arc(0,-40,9,0,7);g.fill();
        
        if(dirtMode.state==='walk'){
            // Лопата за спиной
            g.strokeStyle='#bbb';g.lineWidth=3;g.beginPath();g.moveTo(-15,-15);g.lineTo(15,-35);g.stroke();
            g.fillStyle='#888';g.fillRect(15,-40,8,10);
            g.strokeStyle=cg.j;g.lineWidth=4;g.beginPath();g.moveTo(0,-20);g.lineTo(-10,0);g.stroke();g.beginPath();g.moveTo(0,-20);g.lineTo(10,0);g.stroke();
        }else{
            // Лопата в руках и анимация копания
            dirtMode.digTimer+=dt;
            let swing=Math.sin(dirtMode.digTimer*10)*0.5;
            g.save();g.translate(0,-20);g.rotate(swing);
            g.strokeStyle=cg.j;g.lineWidth=4;g.beginPath();g.moveTo(0,0);g.lineTo(15,5);g.stroke();
            g.strokeStyle='#bbb';g.lineWidth=3;g.beginPath();g.moveTo(15,5);g.lineTo(30,20);g.stroke();
            g.fillStyle='#888';g.fillRect(30,20,10,8);
            g.restore();
            if(dirtMode.digTimer>1.0){dirtMode.state='walk';dirtMode.digTimer=0;dirtMode.ramps.push({x:dirtMode.px+100});$+=5;say('+5$ за трамплин!');save();}
        }
    }else{
        g.rotate(dirtMode.rot);g.scale(SC,SC);drawBike(0,0,true,undefined,trick,false);
    }
    g.restore();
    
    txt('РЕЖИМ: ДЁРТ',15,30,20,'#fff');txt('$'+Math.floor($),15,60,18,'#0f0');
    if(dirtMode.state==='walk'){
        txt('НАЖМИ "КОПАТЬ" (+5$)',w/2,30,16,'#fc0','center');
        circleBtn(w*0.2,h*0.8,50,'#c33',drawBrakeIcon,null,true);circleBtn(w*0.8,h*0.8,50,'#2a7',drawChainring,null,true);
        btn('КОПАТЬ',w/2-80,h-80,160,50,()=>{dirtMode.state='dig';dirtMode.digTimer=0},'#a62');
        btn('СЕСТЬ НА ВЕЛ',w/2-100,80,200,40,()=>{dirtMode.state='ride'},'#357');
        btn('В МЕНЮ',10,h-60,100,40,()=>{save();S='menu'},'#555');
    }else if(dirtMode.state==='dig'){
        txt('КОПАЕМ...',w/2,30,24,'#a62','center');
    }else if(dirtMode.state==='ride'){
        if(!dirtMode.air){
            txt('РАЗГОНЯЙСЯ!',w/2,30,16,'#fc0','center');
            circleBtn(w*0.2,h*0.8,50,'#c33',drawBrakeIcon,null,true);circleBtn(w*0.8,h*0.8,50,'#2a7',drawChainring,null,true);
            btn('СЛЕЗТЬ',10,h-60,100,40,()=>{dirtMode.state='walk';dirtMode.vx=0;dirtMode.air=false},'#555');
        }else{
            txt('ДЕЛАЙ ТРЮК!',w/2,30,20,'#e70','center');txt('+100$',w/2,55,14,'#fff','center');
            circleBtn(w*0.2,h*0.8,50,'#74a',(cx,cy,r,col)=>drawFlipIcon(cx,cy,r,col,-1),null,true);
            circleBtn(w*0.8,h*0.8,50,'#74a',(cx,cy,r,col)=>drawFlipIcon(cx,cy,r,col,1),null,true);
        }
    }

function stunt(dt){const w=W,h=H;const fs=Math.min(3,dt*60);const gy=h*0.8;const btnR=Math.min(60,w*0.1);const gx=w*0.25,gyC=h-btnR-20,sx=w*0.75,syC=h-btnR-20;const isG=heldCircle(gx,gyC,btnR),isS=heldCircle(sx,syC,btnR);if(!cr){if(!P.stuntSpeed)P.stuntSpeed=0;if(isG)P.stuntSpeed+=0.15*fs;else P.stuntSpeed-=0.05*fs;P.stuntSpeed=Math.max(0,Math.min(12,P.stuntSpeed));P.x+=P.stuntSpeed*fs;if(isS&&P.stuntSpeed>1)P.a-=(0.001+P.stuntSpeed*0.0005)*fs;else P.a+=0.008*fs;if(P.a>0)P.a=0;if(P.a<-1.8){cr=1;const e=Math.floor(stuntPoints);$+=e;if(stuntPoints>stuntBest)stuntBest=Math.floor(stuntPoints);save()}if(P.a<-0.3&&P.a>-1.7&&P.stuntSpeed>2)stuntPoints+=P.stuntSpeed*dt*5}else cr+=fs;const cx=P.x-w*0.35;const grd=g.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#4a90d9');grd.addColorStop(1,'#a8d8ff');g.fillStyle=grd;g.fillRect(0,0,w,h);g.fillStyle='#ffe066';g.beginPath();g.arc(w*0.85,h*0.18,w*0.06,0,7);g.fill();g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<6;i++){const sx2=((i*(w*.3)-cx*.2)%(w+200))-100,sy2=h*.1+(i%3)*h*.08,sz=w*.04;g.beginPath();g.arc(sx2,sy2,sz,0,7);g.arc(sx2+sz,sy2,sz*.83,0,7);g.arc(sx2-sz,sy2,sz*.83,0,7);g.fill()}g.fillStyle='#444';g.fillRect(0,gy,w,h-gy);g.strokeStyle='#fff';g.lineWidth=4;for(let i=Math.floor(cx/100)*100;i<cx+w;i+=100){g.beginPath();g.moveTo(i-cx,gy+10);g.lineTo(i-cx+40,gy+10);g.stroke()}if(!cr){g.save();g.translate(w*0.35,gy-(P.y||0));g.rotate(P.a);g.scale(SC,SC);drawBike(0,P.x,true,undefined,{},false);g.restore()}else{g.save();g.translate(w*0.35,gy);g.rotate(1.5);g.scale(SC,-SC);drawBike(0,P.x,false,undefined,{},false);g.restore()}txt('STUNT',w/2,30,22,'#e0e','center');txt('Очки: '+Math.floor(stuntPoints)+' Лучший: '+Math.floor(stuntBest),w/2,60,16,'#fc0','center');const barW=200,barH=12,bx=w/2-barW/2,by=80;g.fillStyle='rgba(0,0,0,0.5)';g.fillRect(bx,by,barW,barH);let pct=Math.max(0,Math.min(1,Math.abs(P.a)/1.8));g.fillStyle=P.a<-1.5?'#f55':P.a<-0.9?'#fc0':'#0f0';g.fillRect(bx,by,barW*pct,barH);g.strokeStyle='#fff';g.lineWidth=2 function rb(dt){const fs=Math.min(3,dt*60);while(nm<P.x+W*2){ms.push(nm);nm+=300+Math.random()*400}while(nr<P.x+W*2){rp.push({x:nr,used:0});nr+=600+Math.random()*600}const vmax=8+rbLevel*1.5;const btnR=Math.min(55,Math.min(W,H)*.11);const gx=W-btnR-20,gyC=H-btnR-25,bx=btnR+20,by=H-btnR-25,jx=W/2,jy=H-btnR-25;let isB=false;if(!rbFinished&&!cr){if(!P.air){const gs=heldCircle(gx,gyC,btnR),bk=heldCircle(bx,by,btnR);isB=bk;if(gs&&!bk)P.vx+=vmax*.025*fs;else if(bk&&!gs)P.vx-=vmax*.045*fs;else P.vx*=Math.pow(.99,fs);P.vx=Math.max(0,Math.min(vmax,P.vx))}P.x+=P.vx*fs;rbDist=Math.floor(P.x/10);if(P.x>rbTarget*10){rbFinished=true;if(rbLevel===1){unlocked.rbHelmet=true;unlocked.rbChest=true;say('РАЗБЛОКИРОВАНА ЭКИПИРОВКА RED BULL!')}if(rbLevel<5)rbLevel++;$+=1500*rbLevel;save()}const gy=T(P.x)-GL*SC,sl=Math.atan2(T(P.x+40)-T(P.x-40),80);rp.forEach(t=>{if(!P.air&&Math.abs(t.x-P.x)<Math.max(P.vx,1)&&(!t.used||performance.now()-t.used>700)){P.air=1;P.vy=-9-rbLevel*1.2;t.used=performance.now()}});rp=rp.filter(t=>t.x>P.x-600);if(!P.air){P.y+=(gy-P.y)*.35*fs;P.a=sl}else{P.vy+=.4*fs;P.y+=P.vy*fs;const r=(heldCircle(bx,by,btnR)?-1:0)+(heldCircle(gx,gyC,btnR)?1:0);P.a+=r*7*dt;P.tot+=r*7*dt;if(P.y>=gy&&P.vy>0){P.air=0;const d=Math.atan2(Math.sin(P.a),Math.cos(P.a));if(Math.abs(d-sl)<1.5){const fl=Math.round(Math.abs(P.tot)/6.2832);if(fl>0)$+=fl*(r>0?50:200)}else{let sv=false;if((gear.rbHelmet&&unlocked.rbHelmet)&&(gear.rbChest&&unlocked.rbChest)&&rbLives>0){rbLives--;say('RED BULL СПАС! ЖИЗНЕЙ: '+rbLives);sv=true}if(!sv){cr=1;cv=Math.max(P.vx,2)*1.1}else{P.a=sl;P.vx*=0.5;P.y=gy;P.tot=0}}P.tot=0}}}else if(cr){cr+=fs;cv*=.93;P.x+=cv*fs}const cx=P.x-W*.35;g.fillStyle='#fbc';g.fillRect(0,0,W,H);if(rbTarget*10-cx<W&&rbTarget*10-cx>-100){for(let i=0;i<H;i+=40){g.fillStyle='#000';g.fillRect(rbTarget*10-cx,i,10,20);g.fillStyle='#fff';g.fillRect(rbTarget*10-cx,i+20,10,20)}txt('ФИНИШ',rbTarget*10-cx+15,H/2,22,'#d90000')}g.fillStyle='#d5b';g.beginPath();g.moveTo(0,H);for(let i=0;i<=W;i+=12)g.lineTo
