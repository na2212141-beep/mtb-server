<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>

#policy-overlay { display: flex; background: rgba(10, 15, 30, 0.98); z-index: 1003; }
#warn-overlay { z-index: 1001; }
#text-overlay { z-index: 1004; }

#code-overlay input, #nick-overlay input, #policy-overlay input, #text-overlay input, #duel-overlay input {width: 80%; max-width: 400px; padding: 15px; font-size: 20px; text-align: center;font-family: "Courier New", monospace; border: 2px solid #fc0; background: #111; color: #fff;border-radius: 8px; outline: none; margin-bottom: 20px;}
#code-overlay button, #nick-overlay button, #warn-overlay button, #policy-overlay button, #text-overlay button, #duel-overlay button {padding: 15px 40px; font-size: 18px; font-weight: bold;font-family: "Courier New", monospace; border-radius: 8px; border: none; cursor: pointer; margin: 10px; color: #fff;}
.btn-green { background: #2a7; } .btn-red { background: #e33; } .btn-blue { background: #357; }

<script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});
const wrap=document.getElementById('game-wrap');
g.imageSmoothingEnabled=false;

// ===== СЕТЬ =====
const socket = io('https://mtb-server.onrender.com', { transports: ['websocket'] });
let opponents = {}, onlinePlayersCount = 0, serverPlayersList = [];
let releaseText = "РЕЛИЗ MTB FREERIDE!";
let isDevOnStage = false;

socket.on('connect', () => { console.log('✅ Подключено!', socket.id); });
socket.on('playerConnected', () => { onlinePlayersCount++; });
socket.on('playerDisconnected', () => { onlinePlayersCount = Math.max(0, onlinePlayersCount - 1); });
socket.on('opponentMove', (data) => { opponents[data.id] = { x: data.x, y: data.y, a: data.a || 0, air: data.air || 0, nick: data.nick || 'Игрок', lastSeen: Date.now() }; });
socket.on('releaseAnnouncement', (text) => { releaseText = text; });
socket.on('stageStatus', (status) => { isDevOnStage = status; });
socket.on('loadDataFromServer', (data) => { if(data.money !== undefined) $ = data.money; if(data.metal !== undefined) M = data.metal; if(data.best !== undefined) best = data.best; if(data.ownedBikes) own = data.ownedBikes; saveLocal(); });
socket.on('adminGetAllResult', (players) => { serverPlayersList = players; alert("Данные загружены!"); });
socket.on('chatMessage', (data) => { const box = document.getElementById('chat-messages'); const msg = document.createElement('div'); msg.innerHTML = `<span style="color:#fc0">${data.nick}:</span> <span style="color:#fff">${data.text}</span>`; box.appendChild(msg); if (box.children.length > 5) box.removeChild(box.firstChild); box.scrollTop = box.scrollHeight; });

// Дуэль события
socket.on('receiveDuelInvite', (data) => {
    duelState.pendingChallengerId = data.fromId;
    duelState.bet = data.bet;
    document.getElementById('duel-info-text').innerHTML = `Игрок <b style="color:#fc0">${data.fromNick}</b> вызывает тебя на дуэль!<br>Ставка: <b style="color:#0f0">$${data.bet}</b>`;
    document.getElementById('duel-overlay').style.display = 'flex';
});
socket.on('duelStarted', (data) => {
    duelState.opponentId = data.opponentId;
    duelState.isChallenger = data.isChallenger;
    startLoading(() => { S='duel'; startDuel(); });
});
socket.on('duelResult', (data) => {
    if(data.win) { $ += data.bet; alert(`ТЫ ПОБЕДИЛ! +$${data.bet}`); } 
    else { alert(`ТЫ ПРОИГРАЛ! -$${data.bet}`); }
    save(); S='menu';
});

// ===== ДУЭЛЬ ФУНКЦИИ =====
let duelState = { active: false, opponentId: null, bet: 0, isChallenger: false, target: 500, pendingChallengerId: null };
function showDuelMenu() {
    let opps = Object.keys(opponents).filter(id => Date.now() - opponents[id].lastSeen < 5000);
    if(opps.length === 0) { alert("В сети нет других игроков для дуэли!"); return; }
    let targetId = opps[0];
    let targetNick = opponents[targetId].nick;
    let bet = prompt(`Игрок ${targetNick} в сети. Введите сумму ставки (например, 5000):`);
    if(bet && parseInt(bet) > 0) {
        bet = parseInt(bet);
        if($ >= bet) {
            socket.emit('sendDuelInvite', { targetId: targetId, fromNick: myNick, bet: bet });
            alert(`Приглашение отправлено игроку ${targetNick} на сумму $${bet}`);
        } else alert("У тебя недостаточно денег!");
    }
}
function acceptDuel() {
    document.getElementById('duel-overlay').style.display = 'none';
    socket.emit('acceptDuel', { challengerId: duelState.pendingChallengerId, bet: duelState.bet, challengerNick: opponents[duelState.pendingChallengerId]?.nick || 'Игрок', accepterNick: myNick });
}
function declineDuel() {
    document.getElementById('duel-overlay').style.display = 'none';
    socket.emit('chatMessage', { nick: 'Система', text: myNick + ' отклонил дуэль.' });
}
function startDuel() {
    P = {x:0, y:T(0)-GL*SC, vy:0, a:0, tot:0, air:0, vx:0};
    ms=[]; nm=400; rp=[]; nr=1000; cr=0; trick={name:'',t:0,maxT:0,bonus:0,col:'#fff',angle:0};
    duelState.active = true;
}
function finishDuel(winnerId, loserNick) {
    if(!duelState.active) return;
    duelState.active = false;
    socket.emit('duelFinished', { winnerId: winnerId, winnerNick: winnerId === socket.id ? myNick : 'Оппонент', loserNick: loserNick, bet: duelState.bet, loserId: winnerId === socket.id ? duelState.opponentId : socket.id });
}

function sendChat() { const input = document.getElementById('chat-input'); const text = input.value.trim(); if (text) { socket.emit('chatMessage', { nick: myNick, text: text }); input.value = ''; } }
function sendReleaseText() { const txt = document.getElementById('release-text-input').value.trim(); if(txt) { socket.emit('releaseAnnouncement', txt); document.getElementById('text-overlay').style.display='none'; } }

// ===== НИКИ =====
let myNick = localStorage.getItem('mtb_nick') || '';
const BAD_WORDS = ['хуй', 'хуя', 'пизд', 'бля', 'еб', 'ёб', 'сук', 'муд', 'говн', 'залуп', 'дроч', 'fuck', 'shit', 'bitch', 'cunt', 'asshole'];
function submitNick() {
    let inputVal = document.getElementById('nick-input').value.trim();
    if (inputVal.length < 3) { alert("Мин. 3 буквы!"); return; }
    let cleanVal = inputVal.toLowerCase().replace(/[^a-zа-яё0-9]/gi, '');
    for (let word of BAD_WORDS) { if (cleanVal.includes(word)) { alert("Мат запрещен!"); return; } }
    myNick = inputVal; localStorage.setItem('mtb_nick', myNick);
    document.getElementById('nick-overlay').style.display = 'none';
    if(socket.connected) socket.emit('getData', myNick);
}
if (myNick) { document.getElementById('nick-overlay').style.display = 'none'; setTimeout(() => { if(socket.connected) socket.emit('getData', myNick); }, 1000); }

function rs(){
  const isPortrait = window.innerHeight > window.innerWidth;
  const newW = isPortrait ? window.innerHeight : window.innerWidth, newH = isPortrait ? window.innerWidth : window.innerHeight;
  if(newW === lastW && newH === lastH && isPortrait === lastRot) return;
  lastW = newW; lastH = newH; lastRot = isPortrait; isRotated = isPortrait;
  if(isPortrait){wrap.classList.add('portrait');W=newW;H=newH;} else {wrap.classList.remove('portrait');W=newW;H=newH;}
  const dpr=Math.min(window.devicePixelRatio||1,3);
  c.width=Math.round(W*dpr);c.height=Math.round(H*dpr); g.setTransform(dpr,0,0,dpr,0,0); g.imageSmoothingEnabled=false;
}
rs(); window.addEventListener('resize',rs); window.addEventListener('orientationchange',()=>{rs();setTimeout(rs,100);setTimeout(rs,300)}); setInterval(rs,200);

let settings={volume:0.5,scale:1.0,showFps:false};
try{const d=JSON.parse(localStorage.getItem('mtb_settings'));if(d){settings.volume=d.volume||0.5;settings.scale=d.scale||1.0;settings.showFps=d.showFps||false}}catch(e){}

let audioCtx=null;

function openCodeUI() { document.getElementById('code-overlay').style.display = 'flex'; document.getElementById('code-input').value = ''; document.getElementById('code-input').focus(); }
function closeCodeUI() { document.getElementById('code-overlay').style.display = 'none'; }
function submitCode() {
  const input = document.getElementById('code-input').value.trim().toUpperCase();
  closeCodeUI();
  if (input === 'MTB-DEV-99' || input === 'MTB-TEST-01') {
    let conf = prompt("Код подтверждения:"); let c2 = conf ? conf.replace(/\s/g, '').toUpperCase() : '';
    if (c2 === 'DF2017' || c2 === 'DF2016' || c2 === 'DF99') {
        if (devCodeUsed) { pendingDevCode = input; document.getElementById('warn-overlay').style.display = 'flex'; } else { activateDevCode(input); }
    } else alert("НЕВЕРНЫЙ КОД!");
  } 
  else if (input === 'ЮМИ' || input === 'КОТ') { $ += 35000; save(); alert('СЕКРЕТНЫЙ КОД АКТИВИРОВАН!\n+$35000!'); }
  else if (input.startsWith('CODE-')) {
    const num = parseInt(input.split('-')[1]);
    if (num >= 1 && num <= 150) {
      if (usedCodes.includes(num)) { alert('Промокод использован!'); return; }
      usedCodes.push(num); $ += 5000; M += 10; save(); alert('Промокод активирован!');
    } else alert('Неверный код.');
  } else alert('Неверный код.');
}
function confirmDevAccess() { document.getElementById('warn-overlay').style.display = 'none'; if (pendingDevCode) { activateDevCode(pendingDevCode); pendingDevCode = ''; } }
function rejectDevAccess() { document.getElementById('warn-overlay').style.display = 'none'; pendingDevCode = ''; alert('Доступ отклонен.'); }

function transformTouch(cx,cy){ const s=settings.scale||1; let gx,gy; if(!isRotated){ gx=cx; gy=cy; } else { gx=cy; gy=H-cx; } return[(gx-W/2)/s+W/2,(gy-H/2)/s+H/2]; }
function handleTap(cx,cy,id){
  const coords=transformTouch(cx,cy); const px=coords[0], py=coords[1]; ptr[id]=[px,py]; const pad = 15; 
  for(let i = btns.length - 1; i >= 0; i--){
    const b = btns[i];
    if(b.cx !== undefined){ if(Math.hypot(px - b.cx, py - b.cy) <= b.r + pad){ if(b.onTap){beep(700,0.05);b.onTap();return} if(b.f && !b.hold){beep(700,0.05);b.f();return} } }
    else if(px >= b.x - pad && px <= b.x + b.w + pad && py >= b.y - pad && py <= b.y + b.h + pad){ if(b.onTap){beep(700,0.05);b.onTap();return} if(b.f){beep(700,0.05);b.f();return} }
  }
}
function handleUp(id){ delete ptr[id]; }
let usingPointer = false;
c.addEventListener('pointerdown', e => { if(e.pointerType === 'mouse' && e.button !== 0) return; usingPointer = true; e.preventDefault(); initAudio(); handleTap(e.clientX, e.clientY, e.pointerId); }, {passive: false});
c.addEventListener('pointerup', e => { e.preventDefault(); handleUp(e.pointerId); }, {passive: false});
c.addEventListener('pointercancel', e => { e.preventDefault(); handleUp(e.pointerId); }, {passive: false});
c.addEventListener('touchstart', e => { if(usingPointer) return; e.preventDefault(); initAudio(); for(let i=0; i<e.changedTouches.length; i++){ const t = e.changedTouches[i]; handleTap(t.clientX, t.clientY, t.identifier); } }, {passive: false});
c.addEventListener('touchend', e => { if(usingPointer) return; e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++){ handleUp(e.changedTouches[i].identifier); } }, {passive: false});
c.addEventListener('touchcancel', e => { if(usingPointer) return; e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++){ handleUp(e.changedTouches[i].identifier); } }, {passive: false});
c.addEventListener('mousedown', e => { if(usingPointer) return; initAudio(); handleTap(e.clientX, e.clientY, 'm'); });
c.addEventListener('mouseup', () => { if(!usingPointer) handleUp('m'); });

function getTimeLeft() {
    let now = new Date().getTime(); let diff = releaseTarget - now; if (diff < 0) diff = 0;
    let d = Math.floor(diff / (1000 * 60 * 60 * 24)); let h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)); let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)); let s = Math.floor((diff % (1000 * 60)) / 1000);
    return { d, h, m, s, diff };
}

function duelMode(dt){
  const fs=Math.min(3,dt*60);
  while(nm<P.x+W*2){ms.push(nm);nm+=300+Math.random()*400}
  while(nr<P.x+W*2){rp.push({x:nr,used:0});nr+=600+Math.random()*600}
  const pStats=partsStats(); let vmax = BK[B].v + (cfS() + pStats.sp)*5;
  if(B === 12) vmax = (ownedParts.super_upg && ownedParts.super_upg[1]) ? 40 : 25;
  else if(B === 11) vmax = 40;

  const btnR=Math.min(55,Math.min(W,H)*.11); const gasCX=W-btnR-20,gasCY=H-btnR-25,brakeCX=btnR+20,brakeCY=H-btnR-25,jumpCX=W/2,jumpCY=H-btnR-25,trickCX=W/2+(btnR+20),trickCY=H-btnR-25;
  let isBraking=false;
  
  if(!cr){

function ride(dt){
  const fs=Math.min(3,dt*60);
  while(nm<P.x+W*2){ms.push(nm);nm+=300+Math.random()*400}
  while(nr<P.x+W*2){rp.push({x:nr,used:0});nr+=600+Math.random()*600}

  if(B === 12) vmax = (ownedParts.super_upg && ownedParts.super_upg[1]) ? 40 : 25;
  else if(B === 11) vmax = 40;

  const btnR=Math.min(55,Math.min(W,H)*.11); const gasCX=W-btnR-20,gasCY=H-btnR-25,brakeCX=btnR+20,brakeCY=H-btnR-25,jumpCX=W/2,jumpCY=H-btnR-25,trickCX=W/2+(btnR+20),trickCY=H-btnR-25;
  let isBraking=false;
  if(!cr){
    if(!P.air){ const gas=heldCircle(gasCX,gasCY,btnR),brake=heldCircle(brakeCX,brakeCY,btnR); isBraking = brake; if(gas&&!brake)P.vx+=vmax*.025*fs; else if(brake&&!gas)P.vx-=vmax*.045*fs; else P.vx*=Math.pow(.985,fs); P.vx=Math.max(0,Math.min(vmax,P.vx)) }
    P.x+=P.vx*fs;const gy=T(P.x)-GL*SC,sl=Math.atan2(T(P.x+40)-T(P.x-40),80);
    rp.forEach(t=>{if(!P.air&&Math.abs(t.x-P.x)<Math.max(P.vx,1)&&(!t.used||performance.now()-t.used>700)){P.air=1;P.vy=-9-RD[R].s*.4;$+=20;t.used=performance.now()}});rp=rp.filter(t=>t.x>P.x-600);
    if(!P.air){sus=sus*.8+(gy-P.y)*.2;P.y+=(gy-P.y)*.35*fs;P.a=sl;$+=P.vx*.02*fs;missions.dist1000.prog=Math.floor(P.x/30)}
    else{
      P.vy+=.4*fs;P.y+=P.vy*fs; const r=(heldCircle(brakeCX,brakeCY,btnR)?-1:0)+(heldCircle(gasCX,gasCY,btnR)?1:0); P.a+=r*7*dt*(1+cfF());P.tot+=r*7*dt*(1+cfF());
      if(trick.name){ trick.t -= dt; if(trick.t <= 0) trick.t = 0; }
      if(P.y>=gy&&P.vy>0){
        P.air=0;const d=Math.atan2(Math.sin(P.a),Math.cos(P.a));const fl=Math.round(Math.abs(P.tot)/6.2832);
        let safeAngle = 1.5; let requireBrake = false; if(B === 12 && P.vx > 15) { safeAngle = 0.8; requireBrake = true; }
        let landedSafe = Math.abs(d-sl) < safeAngle; if(requireBrake && !isBraking) landedSafe = false; 
        if(landedSafe){ if(fl>0){const money=fl*(r>0?30:80);$+=money;say(fl+'x +$'+money);missions.flip5.prog+=fl} }

        if(trick.name){ const earn=Math.round(trick.bonus*Math.max(0,1-trick.t/trick.maxT)); if(earn>0){ $+=earn; missions.trick10.prog++; say(trick.name+' +$'+earn); } trick={name:'',t:0,maxT:0,bonus:0,col:'#fff',angle:0}; }
        P.tot=0;

  }else{cr+=fs;cv*=.93;rv*=.9;P.x+=cv*fs;rX+=rv*fs}

  if(!cr){g.save();g.translate(W*.35,P.y);g.rotate(P.a);g.scale(SC,SC);drawBike(Math.min(8,Math.abs(sus)/SC*1.5),P.x,true,undefined,trick,isBraking);g.restore();
    if(trick.name){ txt(trick.name,W*.35,P.y-120,20,trick.col,'center'); const barW = 100, barH = 6; const bx = W*.35 - barW/2, by = P.y - 100; g.fillStyle='rgba(0,0,0,0.5)';g.fillRect(bx,by,barW,barH); g.fillStyle=trick.col; const pct = Math.max(0, Math.min(1, 1 - (trick.t / trick.maxT))); g.fillRect(bx, by, barW * pct, barH); g.strokeStyle='#fff'; g.lineWidth=1; g.strokeRect(bx,by,barW,barH); }
  }
  else{const sl2=Math.atan2(T(P.x+40)-T(P.x-40),80);g.save();g.translate(W*.35,T(P.x)-GL*SC);g.rotate(sl2+.12);g.scale(SC,-SC);drawBike(0,P.x,false,undefined,{},false);g.restore(); const s3=Math.atan2(T(rX+40)-T(rX-40),80);g.save();g.translate(rX-cx,T(rX));g.rotate(s3);g.scale(SC,SC);drawLying();g.restore()}
  txt('$'+Math.floor($),15,26,20,'#000'); txt('МЕТ '+M,15,48,14,'#000'); txt('⚡'+Math.round(P.vx*10)+' км/ч',15,68,13,'#124'); txt(Math.floor(P.x/30)+' м',W/2,26,18,'#000','center');
  if(gear.rbHelmet && unlocked.rbHelmet && gear.rbChest && unlocked.rbChest && rbLives > 0){ txt('❤️x'+rbLives, W/2, 50, 16, '#e10600', 'center'); }
  txt(socket.connected ? '🟢 В СЕТИ' : '🔴 ОФЛАЙН', W-15, 26, 12, socket.connected ? '#0f0' : '#f55', 'right');

  if(!cr){
    if(!P.air){circleBtn(gasCX,gasCY,btnR,'#2a7',drawChainring,null,true);circleBtn(brakeCX,brakeCY,btnR,'#c33',drawBrakeIcon,null,true);circleBtn(jumpCX,jumpCY,btnR,'#fc0',drawJumpIcon,()=>{if(!P.air){P.air=1;P.vy=-10}})}
    else{circleBtn(brakeCX,brakeCY,btnR,'#74a',(cx,cy,r,col)=>drawFlipIcon(cx,cy,r,col,-1),null,true);circleBtn(gasCX,gasCY,btnR,'#74a',(cx,cy,r,col)=>drawFlipIcon(cx,cy,r,col,1),null,true);circleBtn(trickCX,trickCY,btnR*.85,'#e70',drawStar,()=>{if(!trick.name){const t=TRICKS[Math.floor(Math.random()*TRICKS.length)];trick={name:t.n,t:t.dur,maxT:t.dur,bonus:t.bonus,col:t.col,angle:0}}})}
    btn('X',W-50,10,44,40,()=>{best=Math.max(best,Math.floor(P.x/30));save();S='menu'},'#555')
  }else if(cr>40){
    g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H); txt('УПАЛ',W/2,H/2-50,30,'#f55','center'); txt('Проехал: '+Math.floor(P.x/30)+'м  Рекорд: '+best+'м',W/2,H/2-15,16,'#fff','center');
    btn('ЗАНОВО',W/2-Math.min(180,W*.35)-10,H/2+20,Math.min(180,W*.35),50,()=>{ if(asm2.done && useCf) { if(M >= 10) { M -= 10; save(); startLoading(start); } else { S='menu'; say('Мало металла!'); } } else startLoading(start); },'#2a7');
    btn('МЕНЮ',W/2+10,H/2+20,Math.min(180,W*.35),50,()=>{best=Math.max(best,Math.floor(P.x/30));save();S='menu'},'#555')
  }
}
function drawMissions(){g.fillStyle='rgba(0,0,0,0.6)';g.fillRect(10, 65, 155, 85);txt('МИССИИ', 15, 80, 11, '#fc0');const list=[{k:'flip5',label:'5 флипов'},{k:'trick10',label:'10 трюков'},{k:'dist1000',label:'1000м'},{k:'metal20',label:'20 мет.'}];list.forEach((m,i)=>{const msn=missions[m.k];const y=95+i*13;txt((msn.done?'V ':'')+m.label+': '+Math.min(msn.prog,msn.need)+'/'+msn.need, 15, y, 9, msn.done?'#0f0':'#fff');});}

    g.fillStyle=isEq?'rgba(255,200,0,.15)':'rgba(60,60,80,.5)';g.fillRect(x,y,colW,rowH); g.strokeStyle=isEq?'#fc0':(isOwned?'#39f':'#666');g.lineWidth=isEq?2:1;g.strokeRect(x,y,colW,rowH); g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='left';g.textBaseline='alphabetic';g.fillText(it.n,x+6,y+18);
    if(isEq){g.fillStyle='#fc0';g.font='bold 10px sans-serif';g.fillText('УСТАНОВЛЕНО',x+6,y+38)} else if(isOwned){g.fillStyle='#39f';g.fillText('УСТАНОВИТЬ',x+6,y+38)} else {g.fillStyle='#fc0';g.fillText('$'+it.price,x+6,y+38)}
    btns.push({x,y,w:colW,h:rowH,f:()=>{if(isEq)return;if(isOwned){build[garageTab]=i;save()}else if($>=it.price){$-=it.price;ownedParts[garageTab][i]=1;build[garageTab]=i;save()}else say('Мало денег')}})
  });

function shop(){
  g.fillStyle='#2a2320';g.fillRect(0,0,W,H); backBtn('menu');txt('МАГАЗИН $'+Math.floor($),W/2,44,Math.min(22,W*.045),'#fc0','center'); const rowH=Math.min(42,H*.07);

function startLoading(cb){loading.on=true;loading.p=0;loading.cb=cb}
function start(){P={x:0,y:T(0)-GL*SC,vy:0,a:0,tot:0,air:0,vx:0};ms=[];nm=400;rp=[];nr=1000;cr=0;trick={name:'',t:0,maxT:0,bonus:0,col:'#fff',angle:0};rbLives=5;S='ride'}
function loop(now){
  rs(); now=now||performance.now(); const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now; fpsCount++; if(now-fpsTime>1000){fps=fpsCount;fpsCount=0;fpsTime=now}
  const s=settings.scale,dpr=Math.min(window.devicePixelRatio||1,3); g.setTransform(dpr*s,0,0,dpr*s,W/2*dpr*(1-s),H/2*dpr*(1-s)); btns=[];
  
  // ИСПРАВЛЕН ЧАТ: Появляется ТОЛЬКО если мы в комнате релиза И время релиза наступило
  if(S === 'releaseRoom') {
      let timeLeft = getTimeLeft();
      if(timeLeft.diff <= 0) { document.getElementById('chat-wrapper').style.display = 'flex'; } 
      else { document.getElementById('chat-wrapper').style.display = 'none'; }
  } else {
      document.getElementById('chat-wrapper').style.display = 'none';
  }

  try{
    if(loading.on){loading.p=Math.min(1,loading.p+dt*1.5);if(loading.p>=1){loading.on=false;const cb=loading.cb;loading.cb=null;try{if(cb)cb()}catch(e){S='menu'}}drawLoading()}
    else if(S==='splash')splash(); else if(S==='menu')menu(); else if(S==='patch')patchNotes(); else if(S==='release')releaseScreen(); else if(S==='admin')adminScreen(); else if(S==='records')recordsScreen(); else if(S==='settings')settings_screen(); else if(S==='dirt')dirtModeFunc(dt); else if(S==='ride')ride(dt); else if(S==='duel')duelMode(dt); else if(S==='stunt')stunt(dt); else if(S==='rb')rb(dt); else if(S==='rbMenu')rbMenu(); else if(S==='shop')shop(); else if(S==='garage')garage(); else if(S==='workshop')workshop(); else if(S==='workshop2')workshop2(); else if(S==='dress')dress(); else if(S==='assemble')assemble(dt); else if(S==='releaseRoom')releaseRoom(); else menu();
  }catch(e){}
  if(settings.showFps){ g.fillStyle='rgba(0,0,0,.5)';g.fillRect(W-60,6,54,20); g.fillStyle='#0f0';g.font='bold 12px monospace';g.textAlign='right';g.textBaseline='middle'; g.fillText(fps+' FPS',W-8,16); }
  requestAnimationFrame(loop);
}
